# HASSL Full Configuration (24GB VRAM GPU)
# Dual-network CPS with DynUNet + SwinUNETR for maximum performance

# ─── Data ─────────────────────────────────────────────────────────────
data_dir: "./data"
image_suffix: ".mha"
label_suffix: ".seg.nrrd"
num_classes: 1                    # 1 = binary segmentation (sigmoid), >1 = multi-class (softmax)
# See config.yaml for full rationale: native acquisition spacing on this dataset measured at
# ~0.04-0.13mm; 1.0mm was collapsing labels to 14-156 foreground voxels post-preprocessing.
spacing: [0.1, 0.1, 0.1]           # Spacingd pixdim — 3D volume voxel resolution (mm per voxel)
label_names: null                  # Multi-class label map: {0: 'background', 1: 'bladder', 3:'urethra'}
                                   # null = binary mode (AsDiscreted threshold=0.5)
                                   # dict = NormalizeLabelsInDatasetd remaps to contiguous 0,1,2,...
spatial_size: [128, 128, 128]     # Resized spatial target dimensions
preprocessing_mode: "patch"       # "resize" (Spacingd+Resized whole-volume) or "patch" (Spacingd+RandCrop)
patch_size: [32, 32, 32]          # Patch crop size when preprocessing_mode == "patch"
pos_neg_ratio: 2.0
val_split: 5
cache_dir: "./cache"
use_cache_dataset: true
patient_id_regex: null
server_cache_max_volumes: 20
lcc_min_size_voxels: 100

# ─── Compute ──────────────────────────────────────────────────────────
compute_mode: "full"
device: "cuda"
batch_size: 2
num_workers: 4
use_amp: true
use_gradient_checkpointing: true
seed: 42

# ─── Network ──────────────────────────────────────────────────────────
unet_backbone: "dynunet"
unet_channels: [16, 32, 64, 128, 256]
unet_strides: [2, 2, 2, 2]
unet_num_res_units: 2
dynunet_deep_supervision: true
dropout: 0.2
loss_type: "generalized_dice_focal"
loss_lambda_gdl: 1.0
loss_lambda_focal: 0.5
loss_focal_gamma: 2.0
include_boundary: false
boundary_weight: 0.5
prediction_threshold: 0.5
lcc_fill_holes: true
swinunetr_feature_size: 48

# ─── SSL Pre-training (Phase 2) ───────────────────────────────────────
ssl_epochs: 200
ssl_lr: 0.0001
ssl_weight_decay: 0.00001
ssl_mask_ratio: 0.3
ssl_mask_cube_size: 16
ssl_contrastive_temp: 0.07
ssl_embedding_dim: 128
ssl_use_early_stopping: true
ssl_early_stopping_patience: 20

# ─── Semi-Supervised Training (Phase 3) ───────────────────────────────
train_epochs: 300
train_lr: 0.0001
train_weight_decay: 0.00001
lr_scheduler: "cosine"
min_lr: 0.000001
lr_warmup_epochs: 5
use_early_stopping: true
early_stopping_patience: 30
early_stopping_min_delta: 0.0001
lambda_unsup: 1.0
ema_decay: 0.999
flexmatch_threshold: 0.95
mc_dropout_passes: 10
consistency_rampup_epochs: 80
pseudo_label_weight: 0.5
save_every_n_epochs: 20
log_image_every_n_epochs: 10

# ─── Active Learning (Phase 4) ────────────────────────────────────────
al_query_size: 10
al_rounds: 4
al_strategy: "hybrid"
al_hybrid_weights: [0.4, 0.3, 0.3]

# ─── Pseudo-Label Auto-Promotion Quality Gates ────────────────────────
pseudo_confidence_threshold: 0.85
pseudo_mc_passes: 10
pseudo_mc_var_threshold: 0.05
pseudo_tta_passes: 8
pseudo_tta_var_threshold: 0.02
pseudo_tta_flip: true
pseudo_tta_intensity_std: 0.02

# ─── Experiment Tracking (Phase 5) ───────────────────────────────────
tracker: "wandb"
project_name: "hassl-ultrasound"
experiment_name: "bladder-full"
run_name: null
mlflow_tracking_uri: "http://localhost:5000"

# ─── Directories (Auto-created if missing) ───────────────────────────
checkpoint_dir: "./experiments/checkpoints"
log_dir: "./experiments/logs"
preseg_dir: "./data/al_preseg"
embedding_dir: "./experiments/embeddings"
