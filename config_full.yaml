# HASSL Full Configuration (24GB VRAM GPU)
# Dual-network CPS with DynUNet + SwinUNETR for maximum performance

# ─── Data ─────────────────────────────────────────────────────────────
data_dir: "./data"
image_suffix: ".mha"
label_suffix: ".seg.nrrd"
num_classes: 1                    # 1 = binary segmentation (sigmoid), >1 = multi-class (softmax)
spacing: [1.0, 1.0, 1.0]           # Spacingd pixdim — 3D volume voxel resolution (mm per voxel)
label_names: null                  # Multi-class label map: {0: 'background', 1: 'bladder', 3: 'urethra'}
                                   # null = binary mode (AsDiscreted threshold=0.5)
                                   # dict = NormalizeLabelsInDatasetd remaps to contiguous 0,1,2,...
spatial_size: [128, 128, 128]     # Resized spatial target dimensions
preprocessing_mode: "resize"      # "resize" (Spacingd+Resized whole-volume) or "patch" (Spacingd+RandCrop)
patch_size: [96, 96, 96]          # Patch crop size when preprocessing_mode == "patch"
pos_neg_ratio: 1.0                # Positive/negative sample ratio for RandCropByPosNegLabeld (patch mode)
val_split: 5                      # Number of labeled volumes held out for validation
cache_dir: "./cache"
use_cache_dataset: true           # Cache preprocessed tensors in RAM for fast training epochs
patient_id_regex: null            # Custom regex for extracting patient ID prefix from volume filename
server_cache_max_volumes: 20      # Max 3D volumes held in Web UI server LRU image/mask cache
lcc_min_size_voxels: 100          # LCC satellite filter: discard connected components smaller than
                                   # this (voxel count at spatial_size resolution). 100 is safe for
                                   # medium targets (bladder/prostate ~1000-10000 voxels at 128^3).
                                   # Set to 0 to disable filtering entirely.

# ─── Compute ──────────────────────────────────────────────────────────
compute_mode: "full"              # "full" (24GB VRAM dual-network CPS)
device: "cuda"                    # "cuda" or "cpu"
batch_size: 2                     # Batch size 2 for 24GB VRAM
num_workers: 4
use_amp: true                     # Automatic Mixed Precision (FP16) training
use_gradient_checkpointing: true  # Memory optimization for UNet/SwinUNETR
seed: 42

# ─── Network ──────────────────────────────────────────────────────────
unet_backbone: "dynunet"          # "dynunet" (MONAI DynUNet) or "unet" (Standard UNet)
unet_channels: [16, 32, 64, 128, 256]
unet_strides: [2, 2, 2, 2]
unet_num_res_units: 2             # Only used when unet_backbone == "unet"
dynunet_deep_supervision: true    # Enable deep supervision auxiliary loss heads (DynUNet)
dropout: 0.2                      # Dropout rate for MC Dropout during uncertainty estimation
loss_type: "generalized_dice_focal"# "generalized_dice_focal" (Generalized Dice + Focal) or "dice_ce"
loss_lambda_gdl: 1.0              # Generalized Dice Loss weight (volume-normalized)
loss_lambda_focal: 0.25           # Focal Loss weight (0.25 prevents 99% background mode collapse)
loss_focal_gamma: 2.0             # Focal Loss focusing exponent
include_boundary: true            # Distance transform boundary loss for sharp organ surface alignment
boundary_weight: 0.5              # Weight multiplier for Boundary Loss
include_cldice: false             # Soft Centerline Dice (clDice) loss for 3D topology preservation
cldice_weight: 0.3                # Weight multiplier for clDice Loss
prediction_threshold: 0.5         # Probability decision threshold for binary segmentation
lcc_fill_holes: true              # Apply 3D binary hole filling inside LCC organ predictions
enable_crypto_ledger: true        # SHA-256 cryptographic transaction hashing for data lineage
net_b_backbone: "res_dynunet"     # Secondary network backbone ("res_dynunet" Dual-CNN or "swinunetr")
swinunetr_feature_size: 48        # Secondary network feature size (Secondary network for 24GB mode)

# ─── QC Gate ──────────────────────────────────────────────────────────────
enable_qc_gate: true              # Automated quality control gate after inference
qc_uncertainty_threshold: 0.35   # Max mean foreground entropy before flagging
qc_volume_min_voxels: 500         # Anatomical prior: minimum bladder volume (voxels)
qc_volume_max_voxels: 150000      # Anatomical prior: maximum bladder volume (voxels)
qc_max_cc_count: 3                # Max connected components before flagging
qc_surface_convexity_min: 0.70    # Minimum surface convexity ratio (0–1)

# ─── MedSAM Foundation Model ──────────────────────────────────────────────
medsam_enabled: false             # Set true to enable; downloads weights on first use (~2–5GB)
medsam_variant: "sam_med3d"       # "sam_med3d" | "medsam2" (medsam2 for full 24GB mode)
medsam_checkpoint_dir: "./checkpoints/medsam"
medsam_qc_dice_threshold: 0.50   # Min Dice vs. MedSAM before QC flag
medsam_bootstrap_rounds: 1        # Use MedSAM pseudo-labels for rounds 0..N

# ─── SSL Pre-training (Phase 2) ───────────────────────────────────────
ssl_epochs: 200                   # More epochs for full mode pre-training
ssl_lr: 0.0001
ssl_weight_decay: 0.00001
ssl_mask_ratio: 0.3               # Fraction of volume to mask in masked spatial autoencoding
ssl_mask_cube_size: 16            # Size of each sub-cube mask
ssl_contrastive_temp: 0.07        # Temperature for InfoNCE contrastive loss
ssl_embedding_dim: 128            # Projection head embedding dimension
ssl_use_early_stopping: true      # Stop SSL early if contrastive loss stops improving
ssl_early_stopping_patience: 20   # Epochs to wait before early stopping in SSL

# ─── Semi-Supervised Training (Phase 3) ───────────────────────────────
train_epochs: 300                 # Max epochs per Active Learning round (24GB mode)
train_lr: 0.0001
train_weight_decay: 0.00001
lr_scheduler: "cosine"            # "cosine", "plateau", or "none"
min_lr: 0.000001                  # Minimum learning rate floor
lr_warmup_epochs: 5               # Linear LR warmup epochs at start of training
use_early_stopping: true          # Stop AL round early if validation Dice plateaus
early_stopping_patience: 30       # Validation checks to wait before early stopping
early_stopping_min_delta: 0.0001  # Minimum Dice improvement delta
lambda_unsup: 1.0                 # Max loss weight for unsupervised consistency loss
ema_decay: 0.999                  # EMA teacher momentum coefficient.
                                   # 0.999 is appropriate for full mode which targets large datasets
                                   # (>100 labeled volumes). For small datasets use 0.99 instead.
flexmatch_threshold: 0.95         # Confidence threshold for semi-supervised pseudo-labeling
mc_dropout_passes: 10             # MC Dropout forward passes (10 for 24GB mode)
consistency_rampup_epochs: 80     # Linear rampup duration for unsupervised loss weight.
                                   # 80 epochs gives the EMA teacher time to produce meaningful
                                   # pseudo-labels before the unsupervised loss reaches full weight.
pseudo_label_weight: 0.5          # Weight multiplier for pseudo-labeled approved samples (0.5 = safe)
save_every_n_epochs: 20           # Checkpoint saving frequency
log_image_every_n_epochs: 10      # WandB/MLflow 6-panel uncertainty slice preview logging frequency

# ─── Active Learning (Phase 4) ───────────────────────────────────────
al_query_size: 10                 # Number of volumes to query/promote per round
al_rounds: 4                      # Total Active Learning rounds
al_strategy: "hybrid"             # Query strategy: "bald", "coreset", "disagreement", "hybrid"
al_hybrid_weights: [0.4, 0.3, 0.3]# Weights for (BALD, CoreSet, Disagreement) in hybrid mode

# ─── Pseudo-Label Auto-Promotion Quality Gates ────────────────────────
pseudo_confidence_threshold: 0.85 # Gate 1: Min foreground certainty (85%)
pseudo_mc_passes: 10              # Gate 2: Epistemic MC Dropout forward passes (10 for 24GB)
pseudo_mc_var_threshold: 0.05     # Gate 2: Max allowed epistemic variance
pseudo_tta_passes: 8              # Gate 3: Aleatoric TTA augmented passes
pseudo_tta_var_threshold: 0.02    # Gate 3: Max allowed aleatoric variance
pseudo_tta_flip: true             # Gate 3: Random spatial axis flips during TTA
pseudo_tta_intensity_std: 0.02    # Gate 3: Gaussian intensity jitter std during TTA

# ─── Experiment Tracking (Phase 5) ───────────────────────────────────
tracker: "wandb"                  # "wandb", "mlflow", or "none"
project_name: "hassl-ultrasound"
experiment_name: "bladder-full"
run_name: null                    # Custom run name (auto-generated if null)
mlflow_tracking_uri: "http://localhost:5000"

# ─── Directories (Auto-created if missing) ───────────────────────────
checkpoint_dir: "./experiments/checkpoints"
log_dir: "./experiments/logs"
preseg_dir: "./data/al_preseg"
embedding_dir: "./experiments/embeddings"
