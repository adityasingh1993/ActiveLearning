# HASSL Master Configuration (Prototype Tier - 8GB GPU)
# For full tier (24GB GPU), use config_full.yaml or change compute_mode to "full"

# ─── Data ─────────────────────────────────────────────────────────────
data_dir: "./data"
image_suffix: ".mha"
label_suffix: ".seg.nrrd"
num_classes: 1                    # 1 = binary segmentation (sigmoid), >1 = multi-class (softmax)
# spacing lowered 1.0 -> 0.1mm/voxel: measured native acquisition spacing on this dataset is
# ~(0.06-0.1, 0.04-0.06, 0.1-0.13) mm across two scanner profiles. Resampling to 1.0mm was
# collapsing labeled structures from tens-of-thousands of raw foreground voxels down to only
# 14-156 voxels post-Spacingd+threshold (confirmed via diagnose_label_foreground.py) — this
# was the actual root cause of val_pred_fg_fraction ~ 0 / Dice stuck near 0, not a loss-
# weighting or patch-vs-resize issue. 0.1mm is the finest value get_base_transforms' own OOM
# guard allows (values < 0.1mm skip Spacingd entirely to avoid runaway memory on large
# volumes) — physical extents here are modest (mostly 13-53mm/axis) so this stays affordable.
spacing: [0.1, 0.1, 0.1]
label_names: null
spatial_size: [128, 128, 128]     # Resize target dimensions (resize mode only)
# Patch mode keeps train and validation at the same post-Spacingd physical scale.
# Training uses foreground/background crops; validation keeps the full volume and uses
# SlidingWindowInferer with patch_size windows (no global 128^3 resize).
preprocessing_mode: "patch"
# At spacing=0.1mm, 32^3 covered only ~3.2mm per axis and provided too little surrounding
# context. 64^3 covers ~6.4mm per axis while remaining practical for prototype-mode training.
patch_size: [64, 64, 64]
pos_neg_ratio: 2.0
val_split: 5
# Use a fresh cache namespace because deterministic validation preprocessing changed.
cache_dir: "./cache_supervised64"
use_cache_dataset: true
patient_id_regex: null
server_cache_max_volumes: 20
lcc_min_size_voxels: 100

# ─── Compute ──────────────────────────────────────────────────────────
compute_mode: "prototype"
device: "cuda"
batch_size: 1
num_workers: 2
use_amp: true
use_gradient_checkpointing: true
seed: 42

# ─── Network ──────────────────────────────────────────────────────────
unet_backbone: "dynunet"
unet_channels: [16, 32, 64, 128, 256]
unet_strides: [2, 2, 2, 2]
unet_num_res_units: 2
dynunet_deep_supervision: true
dropout: 0.2
loss_type: "generalized_dice_focal"
loss_lambda_gdl: 1.0
loss_lambda_focal: 0.25
loss_focal_gamma: 2.0
include_boundary: false
boundary_weight: 0.5
prediction_threshold: 0.5
lcc_fill_holes: true
swinunetr_feature_size: 48

# ─── SSL Pre-training (Phase 2) ───────────────────────────────────────
ssl_epochs: 100
ssl_lr: 0.0001
ssl_weight_decay: 0.00001
ssl_mask_ratio: 0.3
ssl_mask_cube_size: 16
ssl_contrastive_temp: 0.07
ssl_embedding_dim: 128
ssl_use_early_stopping: true
ssl_early_stopping_patience: 20

# ─── Semi-Supervised Training (Phase 3) ───────────────────────────────
train_epochs: 200
train_lr: 0.0001
train_weight_decay: 0.00001
lr_scheduler: "cosine"
min_lr: 0.000001
lr_warmup_epochs: 5
use_early_stopping: true
early_stopping_patience: 30
early_stopping_min_delta: 0.0001
# This diagnostic dataset contains only labeled cases, so the unlabeled loader is empty.
# Keep this at zero as an additional guard when the core trainer honors lambda_unsup.
lambda_unsup: 0.0
ema_decay: 0.99
flexmatch_threshold: 0.95
mc_dropout_passes: 5
consistency_rampup_epochs: 80
pseudo_label_weight: 0.5
save_every_n_epochs: 20
log_image_every_n_epochs: 10

# ─── Active Learning (Phase 4) ───────────────────────────────────────
al_query_size: 10
al_rounds: 3
al_strategy: "hybrid"
al_hybrid_weights: [0.4, 0.3, 0.3]

# ─── Pseudo-Label Auto-Promotion Quality Gates ────────────────────────
pseudo_confidence_threshold: 0.85
pseudo_mc_passes: 5
pseudo_mc_var_threshold: 0.05
pseudo_tta_passes: 8
pseudo_tta_var_threshold: 0.02
pseudo_tta_flip: true
pseudo_tta_intensity_std: 0.02

# ─── Experiment Tracking (Phase 5) ───────────────────────────────────
tracker: "wandb"
project_name: "hassl-ultrasound"
experiment_name: "bladder-supervised64-debug"
run_name: null
mlflow_tracking_uri: "http://localhost:5000"

# ─── Directories (Auto-created if missing) ───────────────────────────
# Fresh checkpoint namespace prevents auto-resume from the failed 32^3 experiment.
checkpoint_dir: "./experiments/checkpoints_supervised64"
log_dir: "./experiments/logs"
preseg_dir: "./data/al_preseg"
embedding_dir: "./experiments/embeddings"
